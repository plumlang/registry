# SPDX-License-Identifier: MIT WITH Plumlang-trademarks
name: Yank a version
description: Stop a version of a package you own from being chosen by plum add and plum install.
title: "Yank PACKAGE VERSION"
labels: ["yank"]
body:
  - type: markdown
    attributes:
      value: |
        A yanked version stays installable from lock files that already have it, so nobody's build breaks, but `plum` never chooses it again. Nothing is deleted, and a yank can't be undone by this form: publish a fixed, higher version instead. Only an owner of the package, as the author of this issue, can yank.

        To report a security problem in a package, don't open a public issue: email hello@elixpo.com.
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: weather
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: MAJOR.MINOR.PATCH
      placeholder: 1.2.0
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why, for the people who use it (a bug, a mistake in the release).
    validations:
      required: false
